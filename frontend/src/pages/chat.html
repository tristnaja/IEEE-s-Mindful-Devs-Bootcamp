<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Devs - Chat</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/chat.css">
    <link rel="stylesheet" href="../styles/toast.css">
</head>

<body>
    <div class="toast-container"></div>
    <nav class="navbar">
        <a href="home.html" class="navbar-logo">Mindful Devs</a>
        <a href="#" class="navbar-login-button" id="logout-button">Logout</a>
    </nav>

    <div class="chat-container">
        <header class="chat-header">
            <div class="gemini-logo">
                <svg class="gemini-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"
                        fill="currentColor" />
                    <path d="M12 12m-5 0a5 5 0 1 0 10 0a5 5 0 1 0-10 0" fill="currentColor" />
                </svg>
                <h1>Gemini</h1>
            </div>
        </header>

        <main class="chat-area">
            <!-- Messages will be loaded dynamically here -->
        </main>

        <form class="chat-input-box">
            <input type="text" placeholder="Enter your message…">
            <button type="submit" class="mic-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                </svg>
            </button>
        </form>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/chat.js" defer></script>
</body>

</html>
